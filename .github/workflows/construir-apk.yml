# Construye el APK de Ventico App en los servidores de GitHub.
# Se ejecuta cada vez que subes cambios, o a mano desde la pestaña Actions.
name: Construir APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ventico-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
