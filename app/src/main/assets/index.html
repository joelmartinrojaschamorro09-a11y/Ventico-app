<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.VENTICO_APK=true</script>
<style>:root{color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ventico App</title>
<meta name="theme-color" content="#c42442">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla para celular — encabezado, vista con scroll, barra de cobro y pestañas abajo al alcance del pulgar */
:root{
  --bg:#faf5f4; --surface:#ffffff; --sunk:#f3eae8; --ink:#2a1a1d; --muted:#7a6467; --line:#e9dcda;
  --accent:#c42442; --accent-ink:#ffffff; --accent-soft:#fbe3e7;
  --cash:#17734a; --cash-bg:#ddf1e6; --tr:#1b5ea6; --tr-bg:#e0ebf8; --qr:#6b3db0; --qr-bg:#ece4f7;
  --fi:#935d00; --fi-bg:#f9edd3; --bad:#b3261e; --bad-bg:#fbe2df;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
  --avbg-l:90%; --avfg-l:30%; --lift:0 -8px 24px rgba(42,26,29,.08); --card-sh:0 1px 2px rgba(42,26,29,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161012; --surface:#221a1c; --sunk:#1c1517; --ink:#f6eced; --muted:#ad999c; --line:#372b2e;
  --accent:#ff5872; --accent-ink:#2a0710; --accent-soft:#3c1922;
  --cash:#62d39d; --cash-bg:#163323; --tr:#82b3f2; --tr-bg:#16283f; --qr:#bd9ff2; --qr-bg:#2a2040;
  --fi:#f2b955; --fi-bg:#372911; --bad:#ff8b80; --bad-bg:#3c1c19; --avbg-l:26%; --avfg-l:82%; --lift:0 -8px 24px rgba(0,0,0,.45); --card-sh:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161012; --surface:#221a1c; --sunk:#1c1517; --ink:#f6eced; --muted:#ad999c; --line:#372b2e;
  --accent:#ff5872; --accent-ink:#2a0710; --accent-soft:#3c1922;
  --cash:#62d39d; --cash-bg:#163323; --tr:#82b3f2; --tr-bg:#16283f; --qr:#bd9ff2; --qr-bg:#2a2040;
  --fi:#f2b955; --fi-bg:#372911; --bad:#ff8b80; --bad-bg:#3c1c19; --avbg-l:26%; --avfg-l:82%; --lift:0 -8px 24px rgba(0,0,0,.45); --card-sh:none; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;position:relative;width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.mark::after{content:"";position:absolute;right:6px;bottom:8px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.mark.big{width:56px;height:56px;border-radius:17px;font-size:32px}
.mark.big::after{width:8px;height:8px;right:9px;bottom:12px}
.bt{display:flex;flex-direction:column;min-width:0}
.bt b{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:hsl(var(--h,340) 60% var(--avbg-l));color:hsl(var(--h,340) 55% var(--avfg-l))}
.av.lg{width:52px;height:52px;font-size:20px}
.wt{display:flex;flex-direction:column;line-height:1.15;text-align:left;min-width:0}
.wt small{font-size:11px;color:var(--muted)}
.wt span{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.who{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px;min-width:0;max-width:52%}
.who small{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cash)}

.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:9px;font-size:14px;background:var(--fi-bg);color:var(--ink)}
.notice.bad{background:var(--bad-bg)}
.notice button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:16px 24px}
.stack{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h3{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
p{margin:0}

/* Vender */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pgrid.small{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pgrid.small{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pwrap{position:relative;display:flex;min-width:0}
.pbtn{flex:1;width:100%;min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--card-sh);transition:transform .08s ease,border-color .15s,background .15s}
.pbtn:active{transform:scale(.97)}
.pbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.mono{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;background:hsl(var(--h) 60% var(--avbg-l));color:hsl(var(--h) 55% var(--avfg-l));margin-bottom:2px}
.pn{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp{margin-top:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;font-weight:600}
.pbtn.on .pp{color:var(--accent)}
.pgrid.small .pbtn{min-height:68px;padding:10px 12px;border-radius:14px;gap:2px}
.pgrid.small .pn{-webkit-line-clamp:1;font-size:14px}
.pstep{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;box-shadow:0 2px 6px rgba(196,36,66,.3)}
.pgrid.small .pstep{top:auto;bottom:8px;right:8px}
.pminus{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.24);color:inherit;font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center}
.pminus:active{transform:scale(.9)}
.addrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.addrow button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;font-weight:600;font-size:14px;color:var(--ink)}
.addrow button span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px}
.today{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--ink);color:var(--bg)}
.tmain{display:flex;flex-direction:column;min-width:0}
.tmain small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.tmain strong{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.tmain span{font-size:13px;opacity:.75}
.tsplit{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.tsplit span{display:flex;align-items:center;gap:6px;opacity:.9}
.tsplit b{margin-left:auto;font-weight:700;white-space:nowrap}
.tsplit i{width:8px;height:8px;border-radius:50%;flex:none}
.dot-c{background:var(--cash-bg)}.dot-n{background:var(--tr-bg)}
.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--fi-bg);color:var(--ink);font-size:14px}
.hint b{color:var(--fi)}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.cartbar .primary{padding-inline:28px;min-height:52px;border-radius:14px}
.cartbar .sum{border:0;background:none;padding:0;text-align:left;cursor:pointer}
.lines .nm{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.lines .rm{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;color:var(--bad)}
.tabs.locked button:not([data-id="vender"]):not([data-id="ajustes"]){opacity:.35}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.plain li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
ul.plain li span:first-child{font-weight:600}
.kindtag{font-size:12px;color:var(--muted);font-weight:500;display:block}
.hint button{white-space:nowrap}

.cartbar{display:flex;align-items:center;gap:10px;padding-block:12px;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--lift);position:relative;z-index:2}
.cartbar .sum{flex:1;display:flex;flex-direction:column;min-width:0}
.cartbar .sum small{color:var(--muted);font-size:13px}
.cartbar .sum strong{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}

.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:14px 20px;font-size:17px}
.primary:active{filter:brightness(.92)}
.primary:disabled{opacity:.45}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:12px 14px;font-weight:600}
.block{width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:3px}
a.btnlike{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-block:6px 4px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .15s}
.tabs button[aria-current="page"] svg{background:var(--accent-soft)}

/* Chips y métodos */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.m-efectivo{background:var(--cash-bg);color:var(--cash)}
.m-nequi{background:var(--tr-bg);color:var(--tr)}
.m-qr{background:var(--qr-bg);color:var(--qr)}
.m-fiado{background:var(--fi-bg);color:var(--fi)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-warn{background:var(--fi-bg);color:var(--fi)}
.t-ok{background:var(--cash-bg);color:var(--cash)}

.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mbtn.on.m-efectivo,.mbtn.on.m-nequi,.mbtn.on.m-qr,.mbtn.on.m-fiado{border-color:currentColor}
.mbtn:not(.on){background:var(--surface);color:var(--ink)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--card-sh);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hero{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
dl.ledger{margin:0;display:flex;flex-direction:column;border-top:1px dashed var(--line)}
dl.ledger div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
dl.ledger dt{color:var(--muted);display:flex;gap:8px;align-items:baseline}
dl.ledger dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.money{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px}
.money span{color:var(--muted);font-weight:600}
.money input,.txt{border:0;background:transparent;padding:12px 0;font-size:20px;font-weight:600;width:100%;min-width:0;font-variant-numeric:tabular-nums;outline:none}
.txt{border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-size:16px;font-weight:500}
.money:focus-within,.txt:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:10px 6px;font-weight:600;font-size:14px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.diff{min-height:24px}

/* Ventas */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px}
.daynav button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:22px;line-height:1;color:var(--ink)}
.daynav button:disabled{opacity:.25}
.daynav label{position:relative;min-width:96px;text-align:center;font-weight:700;font-size:15px;text-transform:capitalize;cursor:pointer}
.daynav input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.datepick{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.datepick input{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;font-weight:600;color:var(--ink)}
.sales{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.srow{box-shadow:var(--card-sh);width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.srow .t{font-size:13px;color:var(--muted);font-weight:600;min-width:58px}
.srow .d{display:flex;flex-direction:column;min-width:0}
.srow .d b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .d small{color:var(--muted);font-size:13px}
.srow .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.srow .r b{font-variant-numeric:tabular-nums}
.srow.anulada b{text-decoration:line-through;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}

/* Resumen */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--card-sh);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi small{color:var(--muted);font-size:13px;font-weight:600}
.kpi strong{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi.lead{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.lead small{color:inherit;opacity:.75}
.kpi.lead strong{font-size:38px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .lbl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar .lbl b{font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fill{height:100%;border-radius:99px}
.f-efectivo{background:var(--cash)}.f-nequi{background:var(--tr)}.f-qr{background:var(--qr)}.f-fiado{background:var(--fi)}.f-acc{background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px}
.wcol{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wcol .wv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wcol .wb{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--line);min-height:3px}
.wcol.on .wb{background:var(--accent)}
.wcol .wd{font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize}
.wcol.on .wd{color:var(--ink)}

/* Ajustes */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 112px auto auto;gap:6px;align-items:center}
.prow .txt,.prow .money input{font-size:15px;padding:10px}
.prow .money{padding:0 8px}
.prow .money input{padding:10px 0}
.icon{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;font-size:18px;font-weight:700}
.icon.save{color:var(--cash)}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600}
.person button{border:0;background:var(--sunk);border-radius:50%;width:26px;height:26px}
textarea.txt{min-height:90px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* Hoja inferior */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(20,8,10,.45)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh{display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--sunk);border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lines .nm{font-weight:600;font-size:15px}
.lines .am{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;line-height:1}
.qty b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.total-row{display:flex;justify-content:space-between;align-items:baseline}
.total-row strong{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--cash-bg);color:var(--cash);font-weight:600}
.change.short{background:var(--bad-bg);color:var(--bad)}
.change strong{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.danger{border:0;background:var(--bad-bg);color:var(--bad);font-weight:700;border-radius:12px;padding:14px 20px;font-size:16px}
.danger.solid{background:var(--bad);color:var(--bg)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
#toast button,#toast a{border:0;background:none;color:inherit;font-weight:700;padding:4px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.typegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-weight:600}
.typegrid label{display:flex;align-items:center;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px;cursor:pointer}
.typegrid input{position:absolute;opacity:0;pointer-events:none}
.typegrid label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.typegrid label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.people.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.personbtn{display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.2;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:18px 12px;font-weight:700;font-size:17px;text-align:center}
.personbtn:active{transform:scale(.97)}
.personbtn small{font-size:12px;font-weight:600;color:var(--muted);margin-top:-4px}
.pin{font-size:24px!important;letter-spacing:.4em;text-align:center}
.pin::placeholder{letter-spacing:normal;font-size:16px}
.lockmsg{padding:10px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:14px}
.who svg{color:var(--muted)}
.policy{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--sunk);line-height:1.5}
.credit{text-align:center;font-size:13px;color:var(--muted);padding-block:4px 8px}
.policy h4{font-family:var(--display);font-size:16px;margin:8px 0 0}
.policy ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.check.terms{align-items:flex-start;font-weight:500;line-height:1.45}
.check.terms input{flex:none;margin-top:2px}
.check.terms .link{font-size:inherit}
.auth{max-width:440px;margin:0 auto;width:100%}
.authhead{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.authtitle{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.nqbox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--tr-bg);color:var(--tr)}
.nqbox div{display:flex;flex-direction:column}
.nqbox small{font-weight:600;font-size:13px}
.nqbox strong{font-family:var(--display);font-size:22px}
.qrwarn{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:12px;background:var(--qr-bg);color:var(--qr)}
.qrwarn small{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.qrwarn strong{font-family:var(--display);font-size:34px;font-weight:700}
.camera{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--qr);color:var(--qr);background:var(--qr-bg);border-radius:14px;padding:24px 16px;font-weight:700;font-size:17px;cursor:pointer}
.camera small{font-weight:500;font-size:13px;color:var(--muted)}
.ev{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
a.primary{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<div id="toast" role="status" hidden></div>

<script>
(function(){
const KEY='cuadre.v3';
const LOCK_MS=10*60*1000,ITER=310000;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$ '+Math.round(n||0).toLocaleString('es-CO');
const thou=n=>n?Math.round(n).toLocaleString('es-CO'):'';
const digits=v=>parseInt(String(v||'').replace(/\D/g,''),10)||0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dk=d=>{const x=d?new Date(d):new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const td=()=>dk();
const dayLong=k=>new Date(k+'T12:00:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'});
const tm=ts=>new Date(ts).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
const hue=n=>{let h=7;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))%360;return h};
const STOP=new Set(['con','de','del','la','el','en','y','a','al','las','los']);
const initials=(n)=>{const w=String(n||'?').split(/\s+/).filter(x=>x&&!STOP.has(x.toLowerCase()));if(!w.length)return '?';
  return (w.length===1?w[0][0]:w[0][0]+w[w.length-1][0]).toUpperCase()};
const sum=(a,f)=>a.reduce((t,x)=>t+(x[f]||0),0);
const M={efectivo:'Efectivo',nequi:'Nequi',qr:'Nequi QR',fiado:'Fiado'};
const MI={efectivo:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v4M18 10v4"/></svg>',
  nequi:'<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
  qr:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M17 21h4v-4M14 18v3"/></svg>'};

let storageOk=true;
/* Almacenamiento cifrado. O = sobre externo (lo único legible sin clave): nombre del negocio, nombres de quienes venden,
   la llave de datos envuelta con la contraseña del dueño y con cada PIN, los datos cifrados y el contador de intentos. */
const te=new TextEncoder(),tdc=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function kek(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(salt),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,bytes){const iv=rnd(12);return {iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct)))}
async function wrapWith(secret,raw){const salt=b64(rnd(16));return Object.assign({salt},await aesEnc(await kek(secret,salt),raw))}
async function unwrapWith(secret,w){return aesDec(await kek(secret,w.salt),w)}
let O=null,DEK=null,DEKraw=null,role=null,chain=Promise.resolve();
function loadOuter(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){storageOk=false;return null}}
function saveOuter(){try{if(O)localStorage.setItem(KEY,JSON.stringify(O));else localStorage.removeItem(KEY);storageOk=true}catch(e){storageOk=false}}
async function useDEK(raw){DEKraw=raw;DEK=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
function save(){if(!DEK||!S||!O)return;const snap=te.encode(JSON.stringify(S)),key=DEK;
  O.meta.business=biz();O.meta.owner=S.profile.name;O.meta.type=S.profile.type;
  chain=chain.then(async()=>{O.data=await aesEnc(key,snap);saveOuter()}).catch(()=>{storageOk=false})}
function logA(action,detail,extra){if(!S)return;S.log=S.log||[];S.log.push(Object.assign({ts:Date.now(),who:(S.seller||'')+(role==='owner'?' (dueño)':isOwner()?' (con clave del dueño)':''),action,detail:detail||''},extra||{}));if(S.log.length>1500)S.log.splice(0,S.log.length-1500)}
const isOwner=()=>role==='owner'||(ui&&ui.elevUntil>Date.now());
const pinWeak=p=>/^(\d)\1+$/.test(p)||'01234567890'.includes(p)||'09876543210'.includes(p);
const lockLeft=()=>Math.max(0,((O&&O.lock&&O.lock.until)||0)-Date.now());
function failAttempt(){O.lock=O.lock||{};O.lock.fails=(O.lock.fails||0)+1;O.lock.total=(O.lock.total||0)+1;
  if(O.lock.fails>=5){O.lock.until=Date.now()+Math.min(30*60000,60000*Math.pow(2,O.lock.fails-5));}saveOuter();
  const w=lockLeft();return w?`Demasiados intentos. Espera ${Math.ceil(w/60000)} min`:`Clave incorrecta (${O.lock.fails} de 5 intentos)`}
async function openWith(raw,who,r,how){
  await useDEK(raw);S=JSON.parse(tdc.decode(await aesDec(DEK,O.data)));role=r;S.seller=who;authed=true;ui.elevUntil=0;lastAct=Date.now();
  const f=(O.lock&&O.lock.total)||0;O.lock={fails:0,until:0,total:0};
  logA('Entrada',how+(f?` tras ${f} intento${f>1?'s':''} fallido${f>1?'s':''}`:''),f?{fails:f}:null);save();
}
function lock(){if(!authed)return;save();S=null;DEK=null;DEKraw=null;role=null;authed=false;ui.elevUntil=0;ui.pending=null;ui.lockSel=null;
  for(const k in memPh)delete memPh[k];closeSheet();render()}
let lastAct=Date.now();

function seed(){
  const products=[
    {id:'p1',name:'Fresas con crema pequeña',price:6000,kind:'producto'},
    {id:'p2',name:'Fresas con crema mediana',price:8000,kind:'producto'},
    {id:'p3',name:'Fresas con crema grande',price:10000,kind:'producto'},
    {id:'p4',name:'Fresas con helado',price:9000,kind:'producto'},
    {id:'a1',name:'Chocolate',price:1000,kind:'adicional'},
    {id:'a2',name:'Arequipe',price:1000,kind:'adicional'},
    {id:'a3',name:'Leche condensada',price:1000,kind:'adicional'},
    {id:'a4',name:'Chispas',price:1000,kind:'adicional'},
    {id:'a5',name:'Queso rallado',price:1500,kind:'adicional'},
    {id:'a6',name:'Galleta Oreo',price:1500,kind:'adicional'}
  ];
  const sellers=['Valentina','Sara'];
  const sales=[],expenses=[],days={};
  let r=11;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  const mk=(ts,spec,method,extra)=>{
    const items=spec.map(([pid,qty])=>{const p=products.find(x=>x.id===pid);return{pid,name:p.name,price:p.price,qty}});
    const total=items.reduce((a,i)=>a+i.price*i.qty,0);const day=dk(ts);
    const s={id:uid()+sales.length,ts,day,items,total,method,payDay:method?day:null,status:'ok',
      transfer:method&&method!=='efectivo'?'recibida':null,seller:sellers[Math.floor(rnd()*2)]};
    Object.assign(s,extra||{});
    if(s.received)s.change=s.received-total;
    return s;
  };
  for(let d=6;d>=1;d--){
    const b=new Date();b.setDate(b.getDate()-d);b.setHours(15,0,0,0);const k=dk(b);
    days[k]={base:30000};
    const n=9+Math.floor(rnd()*14);
    for(let i=0;i<n;i++){
      const ts=b.getTime()+Math.floor(i*240/n)*60000;
      const spec=[[['p1','p2','p3','p4'][Math.floor(rnd()*4)],1]];
      if(rnd()>.4)spec.push([['a1','a2','a3','a4','a5','a6'][Math.floor(rnd()*6)],1]);
      const q=rnd();sales.push(mk(ts,spec,q<.55?'efectivo':q<.85?'nequi':'qr'));
    }
    expenses.push({id:uid()+'e'+d,ts:b.getTime(),day:k,desc:'Fresas y crema de leche',amount:35000+Math.floor(rnd()*4)*5000,method:'efectivo'});
  }
  const now=Date.now(),T=m=>now-m*60000,today=dk();
  days[today]={base:30000};
  [[95,[['p2',1],['a1',1]],'efectivo',{received:10000}],
   [88,[['p3',1],['a5',1],['a2',1]],'nequi'],
   [80,[['p1',2]],'efectivo',{received:20000}],
   [71,[['p2',1],['a6',1]],'qr'],
   [64,[['p3',1]],'efectivo',{status:'anulada',voidReason:'Cliente no pudo pagar',voidTs:T(63)}],
   [55,[['p4',1],['a3',1]],'efectivo',{received:10000}],
   [41,[['p2',2],['a4',2]],'nequi',{transfer:'pendiente'}],
   [30,[['p1',1],['a1',1]],null,{status:'fiada',debtor:'Don Jaime, vecino del puesto'}],
   [18,[['p3',1],['a2',1]],'efectivo',{received:20000}],
   [6,[['p2',1]],'qr']
  ].forEach(([m,spec,meth,ex])=>sales.push(mk(T(m),spec,meth,ex)));
  expenses.push({id:uid()+'et',ts:T(120),day:today,desc:'Vasos, cucharas y servilletas',amount:12000,method:'efectivo'});
  return {v:1,demo:true,setupDone:true,products,sellers,seller:'Valentina',sales,expenses,days};
}

const TYPES=[
  {id:'postres',name:'Postres y fresas',p:['Fresas con crema','Ensalada de frutas','Obleas','Helado','Salpicón'],a:['Queso','Arequipe','Chocolate','Chispas']},
  {id:'rapidas',name:'Comidas rápidas',p:['Perro caliente','Hamburguesa','Salchipapa','Empanada','Arepa rellena'],a:['Queso extra','Tocineta','Gaseosa','Papas']},
  {id:'bebidas',name:'Jugos y bebidas',p:['Jugo en agua','Jugo en leche','Limonada','Avena','Agua'],a:['Tamaño grande','Leche','Hielo extra']},
  {id:'asados',name:'Asados y fritos',p:['Mazorca asada','Chuzo','Papa rellena','Chorizo','Pincho'],a:['Arepa','Queso','Mantequilla']},
  {id:'cafe',name:'Café y panadería',p:['Tinto','Café con leche','Aromática','Pan','Buñuelo'],a:['Queso','Pan extra']},
  {id:'mecato',name:'Dulces y mecato',p:['Dulce','Paquete de papas','Galletas','Gaseosa','Agua'],a:[]},
  {id:'otro',name:'Otro',p:[],a:[]}];
const typeOf=()=>TYPES.find(t=>t.id===((S&&S.profile&&S.profile.type)||(O&&O.meta.type)))||TYPES[TYPES.length-1];
const biz=()=>S&&S.profile?(S.profile.business||S.profile.name):(O?O.meta.business:'');
function blank(){return {v:3,profile:null,demo:false,setupDone:false,products:[],sellers:[],seller:'',sales:[],expenses:[],days:{},log:[]}}
let S=null,authed=false;
O=loadOuter();if(O&&O.v!==3)O=null;
const cryptoOk=!!(window.crypto&&crypto.subtle);
const phoneOk=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length===12&&d.startsWith('57'))d=d.slice(2);return /^3\d{9}$/.test(d)?d:null};
const fmtPhone=d=>String(d||'').replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3');
const waLink=text=>'https://wa.me/'+(S&&S.profile&&S.profile.wa?'57'+S.profile.wa:'')+'?text='+encodeURIComponent(text);
/* fotos de evidencia: IndexedDB, con respaldo en memoria */
let dbp;const memPh={};
function idb(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('cuadre-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
function phPut(id,d){memPh[id]=d;const key=DEK;if(!key)return Promise.resolve();
  return aesEnc(key,te.encode(d)).then(enc=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(enc,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}))).catch(()=>{})}
function phGet(id){if(memPh[id])return Promise.resolve(memPh[id]);const key=DEK;if(!key)return Promise.resolve(null);
  return idb().then(db=>new Promise(res=>{const r=db.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}))
    .then(o=>o&&o.ct?aesDec(key,o).then(b=>tdc.decode(b)):null).catch(()=>null)}
function phClear(){return idb().then(db=>new Promise(res=>{const t=db.transaction('f','readwrite');t.objectStore('f').clear();t.oncomplete=()=>res();t.onerror=()=>res()})).catch(()=>{})}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{res(c.toDataURL('image/jpeg',.7))}catch(e){res(fr.result)}};im.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- cálculos ---------- */
function calc(day){
  const ss=S.sales.filter(s=>s.day===day);
  const live=ss.filter(s=>s.status!=='anulada');
  const voided=ss.filter(s=>s.status==='anulada');
  const paidOn=m=>S.sales.filter(s=>s.status==='ok'&&s.method===m&&s.payDay===day);
  const cash=sum(paidOn('efectivo'),'total'),tr=sum(paidOn('nequi'),'total'),qr=sum(paidOn('qr'),'total');
  const pend=sum(S.sales.filter(s=>s.status==='ok'&&s.payDay===day&&s.method!=='efectivo'&&s.transfer==='pendiente'),'total');
  const ex=S.expenses.filter(x=>x.day===day);
  const exCash=sum(ex.filter(x=>x.method==='efectivo'),'amount'),exDig=sum(ex.filter(x=>x.method!=='efectivo'),'amount');
  const d=S.days[day]||{};const base=d.base||0;const vendido=sum(live,'total');
  return {ss,live,voided,vendido,count:live.length,cash,tr,qr,dig:tr+qr,pend,ex,exCash,exDig,gastos:exCash+exDig,
    base,opened:d.base!=null,closed:d.closed||null,expCash:base+cash-exCash,ganancia:vendido-exCash-exDig};
}
const fiadoTotal=()=>sum(S.sales.filter(s=>s.status==='fiada'),'total');
const cartItems=()=>Object.entries(ui.cart).filter(([,q])=>q>0).map(([pid,qty])=>{const p=S.products.find(x=>x.id===pid)||(ui.custom||{})[pid];return p?{pid,name:p.name,price:p.price,qty}:null}).filter(Boolean);
const cartTotal=()=>cartItems().reduce((a,i)=>a+i.price*i.qty,0);
const itemsText=s=>s.items.map(i=>(i.qty>1?i.qty+'× ':'')+i.name).join(', ');
function diffHTML(expected,counted){
  if(counted==null||counted==='')return '';
  const d=counted-expected;
  if(d===0)return '<span class="tag t-ok">Cuadra exacto</span>';
  return d<0?`<span class="tag t-bad">Faltan ${fmt(-d)}</span>`:`<span class="tag t-warn">Sobran ${fmt(d)}</span>`;
}
function methodTag(s){
  if(s.status==='anulada')return '<span class="tag t-bad">Anulada</span>';
  if(s.status==='fiada')return '<span class="tag m-fiado">Fiada</span>';
  let h=`<span class="tag m-${s.method}">${M[s.method]}</span>`;
  if(s.method!=='efectivo'&&s.transfer==='pendiente')h+=' <span class="tag t-warn">Por confirmar</span>';
  if(s.method==='qr'&&!s.photo)h+=' <span class="tag t-bad">Sin foto</span>';
  return h;
}

function saleLine(s){
  let m=s.status==='fiada'?'Fiado':M[s.method];
  if(s.method==='qr')m+=s.photo?' (verificado con foto)':' (sin foto)';
  else if(s.method==='nequi'&&s.transfer==='pendiente')m+=' (por confirmar)';
  return m;
}
function saleText(s){
  return [`*Venta registrada* · ${biz()}`,`${dayLong(s.day)}, ${tm(s.ts)}`,
    ...s.items.map(i=>`${i.qty} × ${i.name}: ${fmt(i.price*i.qty)}`),`*Total: ${fmt(s.total)}*`,`Pago: ${saleLine(s)}`,
    s.received?`Pagó con ${fmt(s.received)}, vuelto ${fmt(s.change)}`:null,`Registró: ${s.seller||'—'}`].filter(Boolean).join('\n');
}
function voidText(s){
  return [`*Venta ANULADA* · ${biz()}`,`Venta de las ${tm(s.ts)} (${dayLong(s.day)})`,`${itemsText(s)}: ${fmt(s.total)}`,
    `Motivo: ${s.voidReason||'—'}`,`Anuló: ${s.voidBy||s.seller||'—'} a las ${s.voidTs?tm(s.voidTs):''}`].join('\n');
}
function closeText(day){
  const c=calc(day),cl=c.closed;
  const L=[`*Cierre de caja* · ${biz()}`,dayLong(day),
   `Vendido: ${fmt(c.vendido)} (${c.count} ventas)`,
   ``,`*EFECTIVO*`,`Base: ${fmt(c.base)}`,`Ventas en efectivo: ${fmt(c.cash)}`,`Gastos en efectivo: ${fmt(c.exCash)}`,`Debería haber: ${fmt(c.expCash)}`];
  if(cl&&cl.cash!=null){const d=cl.cash-c.expCash;L.push(`Contado: ${fmt(cl.cash)} → ${d===0?'cuadra':d<0?'faltan '+fmt(-d):'sobran '+fmt(d)}`)}
  const qrs=c.live.filter(s=>s.method==='qr'&&s.status==='ok');
  L.push(``,`*NEQUI*`,`Por número: ${fmt(c.tr)}`,`Por QR: ${fmt(c.qr)} (${qrs.filter(s=>s.photo).length} de ${qrs.length} con foto)`,`Debió llegar: ${fmt(c.dig)}${c.pend?' ('+fmt(c.pend)+' sin confirmar)':''}`);
  if(cl&&cl.dig!=null){const d=cl.dig-c.dig;L.push(`Llegó: ${fmt(cl.dig)} → ${d===0?'cuadra':d<0?'faltan '+fmt(-d):'sobran '+fmt(d)}`)}
  L.push(``,`Gastos totales: ${fmt(c.gastos)}`,`Ganancia aproximada: ${fmt(c.ganancia)}`);
  if(c.voided.length)L.push(`Anuladas: ${c.voided.length} (${fmt(sum(c.voided,'total'))})`);
  const f=fiadoTotal();if(f)L.push(`Fiado pendiente: ${fmt(f)}`);
  if(c.ex.length){L.push(``,`*GASTOS*`);c.ex.forEach(x=>L.push(`${x.desc}: ${fmt(x.amount)} (${M[x.method]})`))}
  const lg=(S.log||[]).filter(x=>dk(x.ts)===day);const fails=lg.reduce((a,x)=>a+(x.fails||0),0)+lg.filter(x=>x.action==='Autorización fallida').length;
  const ch=lg.filter(x=>!['Entrada','Cierre guardado','Caja abierta','Perfil creado','Autorización del dueño'].includes(x.action));
  if(ch.length||fails){L.push(``,`*CAMBIOS Y ALERTAS*`);if(fails)L.push(`Intentos fallidos de clave: ${fails}`);ch.forEach(x=>L.push(`${tm(x.ts)} ${x.who}: ${x.action}${x.detail?' – '+x.detail:''}`))}
  if(c.ss.length){L.push(``,`*DETALLE DE VENTAS*`);c.ss.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>L.push(
    s.status==='anulada'?`~${tm(s.ts)} ${itemsText(s)} ${fmt(s.total)}~ ANULADA: ${s.voidReason||''}`:`${tm(s.ts)} · ${itemsText(s)} · ${fmt(s.total)} · ${saleLine(s)}`))}
  return L.join('\n');
}

function vResumen(){
  const day=ui.rDay,c=calc(day);
  const by={efectivo:0,nequi:0,qr:0,fiado:0};
  c.live.forEach(s=>{if(s.status==='fiada')by.fiado+=s.total;else by[s.method]+=s.total});

  const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,6);const maxP=Math.max(1,...top.map(t=>t[1]));
  const wk=[];for(let i=6;i>=0;i--){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()-i);const k=dk(d);wk.push({k,v:calc(k).vendido,d})}

  return `<div class="stack">
    <div class="toolbar">${dayNav('rDay')}</div>
    <div class="kpis">
      <div class="kpi lead"><small>Vendido el ${esc(dayLong(day))}</small><strong>${fmt(c.vendido)}</strong></div>
      <div class="kpi"><small>Ventas</small><strong>${c.count}</strong></div>
      <div class="kpi"><small>Venta promedio</small><strong>${fmt(c.count?c.vendido/c.count:0)}</strong></div>
      <div class="kpi"><small>Gastos</small><strong>${fmt(c.gastos)}</strong></div>
      <div class="kpi"><small>Ganancia aprox.</small><strong>${fmt(c.ganancia)}</strong></div>
    </div>
    <section class="card"><h3>Cómo pagaron</h3><div class="bars">
      ${Object.keys(by).filter(k=>k!=='fiado'||by[k]).map(k=>`<div class="bar"><div class="lbl"><span>${M[k]}</span><b>${fmt(by[k])}</b></div><div class="track"><div class="fill f-${k}" style="width:${by[k]/maxM*100}%"></div></div></div>`).join('')}
    </div></section>
    <section class="card"><h3>Lo más vendido</h3>
      ${top.length?`<div class="bars">${top.map(([n,q])=>`<div class="bar"><div class="lbl"><span>${esc(n)}</span><b>${q}</b></div><div class="track"><div class="fill f-acc" style="width:${q/maxP*100}%"></div></div></div>`).join('')}</div>`:'<p class="muted">Sin ventas este día.</p>'}
    </section>
    <section class="card"><div class="card-head"><h3>Últimos 7 días</h3><span class="muted num" style="font-size:14px">${fmt(wkTot)}</span></div>
      <div class="week">${wk.map(w=>`<button class="wcol${w.k===day?' on':''}" data-a="pickday" data-id="${w.k}" aria-label="${esc(dayLong(w.k))}: ${fmt(w.v)}">
        <span class="wv">${w.v?Math.round(w.v/1000)+'k':''}</span><span class="wb" style="height:${Math.max(2,w.v/maxW*100)}%"></span>
        <span class="wd">${w.d.toLocaleDateString('es-CO',{weekday:'short'}).slice(0,3)} ${w.d.getDate()}</span></button>`).join('')}</div>
    </section>
    ${c.voided.length?`<section class="card"><h3>Ventas anuladas</h3><dl class="ledger">${c.voided.map(s=>`<div><dt>${tm(s.ts)} · ${esc(s.voidReason||'')}</dt><dd>${fmt(s.total)}</dd></div>`).join('')}</dl></section>`:''}
    ${fiadoTotal()?`<section class="card"><h3>Fiado por cobrar</h3><dl class="ledger">${S.sales.filter(s=>s.status==='fiada').map(s=>`<div><dt>${esc(s.debtor||'Sin nombre')} · ${s.day.slice(5)}</dt><dd>${fmt(s.total)}</dd></div>`).join('')}</dl></section>`:''}
  </div>`;
}

    if(!$('#rgTerms').checked)return toast('Debes leer y aceptar la Política de uso y privacidad');
    if(nqRaw.trim()&&!nq)return toast('El número Nequi debe tener 10 dígitos y empezar por 3');
    const b=document.querySelector('[data-a=doregister]');b.disabled=true;b.textContent='Creando y cifrando…';
    const raw=rnd(32);O={v:3,meta:{business,owner:name,type},pw:await wrapWith(pw,raw),pins:[{name,wrap:await wrapWith(pin,raw)}],data:null,lock:{fails:0,until:0,total:0}};
    S=blank();S.profile={business,type,name,wa,nequi:nq||'',autoSend:true,created:Date.now(),terms:{version:POLICY_V,ts:Date.now()}};S.sellers=[name];S.seller=name;
    await useDEK(raw);role='owner';authed=true;lastAct=Date.now();logA('Perfil creado',business);logA('Política aceptada','versión '+POLICY_V);save();ui.view='vender';render();toast('Perfil creado. Ahora agrega tus productos');setTimeout(()=>{const f=$('#npName');if(f)f.focus()},60)},
  forgot:()=>openSheet('forgot'),
  wipeall:()=>{S=null;O=null;DEK=null;DEKraw=null;role=null;authed=false;saveOuter();phClear();ui.cart={};ui.lockSel=null;closeSheet();render();toast('Perfil y datos borrados de este celular')},
  logout:()=>lock(),
  demo:async()=>{if(!cryptoOk)return toast('Este navegador no permite cifrar');const b=document.querySelector('[data-a=demo]');b.textContent='Preparando…';
    const raw=rnd(32);S=seed();S.v=3;S.log=[];S.profile={business:'Fresas La Esquina (ejemplo)',type:'postres',name:'Valentina',wa:'',nequi:'3001234567',autoSend:true};S.seller='Valentina';
    O={v:3,meta:{business:S.profile.business,owner:'Valentina',type:'postres'},pw:await wrapWith('demo1234',raw),
      pins:[{name:'Valentina',wrap:await wrapWith('2580',raw)},{name:'Sara',wrap:await wrapWith('1379',raw)}],data:null,lock:{fails:0,until:0,total:0}};
    await useDEK(raw);role='owner';authed=true;lastAct=Date.now();save();ui.view='vender';render();toast('Ejemplo listo. Se bloquea tras 10 min sin uso')},
  saveprofile:()=>{const wa=phoneOk($('#pfWa').value),nqRaw=$('#pfNq').value,nq=phoneOk(nqRaw);
    if(!wa)return toast('Escribe un WhatsApp válido de 10 dígitos');if(nqRaw.trim()&&!nq)return toast('Revisa el número Nequi');
    const bz=$('#pfBiz').value.trim();if(bz.length<2)return toast('Escribe el nombre del negocio');
    S.profile.business=bz;S.profile.type=(document.querySelector('input[name=pfType]:checked')||{}).value||S.profile.type;
    const ch=[];if(wa!==S.profile.wa)ch.push('WhatsApp');if((nq||'')!==S.profile.nequi)ch.push('Nequi');if(bz!==S.profile.business)ch.push('nombre');
    S.profile.wa=wa;S.profile.nequi=nq||'';S.profile.autoSend=$('#pfAuto').checked;if(ch.length)logA('Perfil cambiado',ch.join(', '));save();render();toast('Perfil guardado')},
  changepw:async()=>{const o=$('#pfOld').value,n=$('#pfNew').value;
    try{await unwrapWith(o,O.pw)}catch(x){return toast('La contraseña actual no es correcta')}
    if(n.length<6)return toast('La nueva contraseña debe tener al menos 6 caracteres');
    O.pw=await wrapWith(n,DEKraw);logA('Contraseña del dueño cambiada','');save();render();toast('Contraseña cambiada')},
  filter:id=>{ui.vFilter=id;render()},
  sale:id=>{ui.sale=id;ui.voidReason='Cliente no pudo pagar';openSheet('detail')},
  back:()=>{ui.sheet='detail';renderSheet()},
  markrec:()=>{const s=sale();s.transfer='recibida';logA('Nequi confirmado',`${fmt(s.total)} de las ${tm(s.ts)}`);commit();toast('Transferencia confirmada')},
  chmethod:()=>{ui.sheet='method';renderSheet()},
  setmethod:id=>{const s=sale();logA('Forma de pago cambiada',`${fmt(s.total)} de las ${tm(s.ts)}: ${M[s.method]} → ${M[id]}`);s.method=id;s.transfer=id==='efectivo'?null:(s.transfer||'pendiente');if(id!=='efectivo'){delete s.received;delete s.change}ui.sheet='detail';commit();toast('Forma de pago cambiada a '+M[id])},
  paydebt:()=>{ui.sheet='pay';renderSheet()},
  paywith:id=>{const s=sale();logA('Fiado pagado',`${s.debtor||''} ${fmt(s.total)} en ${M[id]}`);s.status='ok';s.method=id;s.payDay=td();s.paidTs=Date.now();s.transfer=id==='efectivo'?null:'pendiente';ui.sheet='detail';commit();toast('Pago registrado: suma a la caja de hoy')},
  voidmode:()=>{ui.sheet='void';renderSheet()},
  reason:id=>{ui.voidReason=id;renderSheet()},
  confirmvoid:()=>{const s=sale();let r=ui.voidReason;if(r==='Otro'){r=(($('#voidOther')||{}).value||'').trim()||'Otro'}
    s.status='anulada';s.voidReason=r;s.voidTs=Date.now();s.voidBy=S.seller;logA('Venta anulada',`${fmt(s.total)} de las ${tm(s.ts)} – ${r}`);ui.sheet='detail';commit();toast('Venta anulada',null,null,autoSend()?{label:'Enviar aviso',href:waLink(voidText(s))}:null)},
  basequick:id=>{const i=$('#base');if(i)i.value=thou(+id)||'0'},
  openday:()=>{const day=ui.cDay,nb=digits(($('#base')||{}).value),old=S.days[day]&&S.days[day].base;
    logA(old==null?'Caja abierta':'Base cambiada',old==null?fmt(nb):`${fmt(old)} → ${fmt(nb)}`);S.days[day]=Object.assign(S.days[day]||{},{base:digits(($('#base')||{}).value)});ui.editBase=false;save();render();toast('Caja abierta con base de '+fmt(S.days[day].base))},
  editbase:()=>{ui.editBase=true;render()},
  seepend:()=>{ui.view='ventas';ui.vDay=ui.cDay;ui.vFilter='pendientes';render()},
  addexp:()=>{const d=$('#expDesc').value.trim(),a=digits($('#expAmt').value);const m=(document.querySelector('input[name=expM]:checked')||{}).value||'efectivo';
    if(!d||!a)return toast('Escribe en qué se gastó y cuánto');
    S.expenses.push({id:uid(),ts:Date.now(),day:ui.cDay,desc:d,amount:a,method:m,by:S.seller});save();render();toast('Gasto agregado')},
  delexp:id=>{const i=S.expenses.findIndex(x=>x.id===id);if(i<0)return;const [x]=S.expenses.splice(i,1);logA('Gasto quitado',`${x.desc} ${fmt(x.amount)}`);save();render();toast('Gasto quitado','Deshacer',()=>{if(!S)return;S.expenses.push(x);logA('Gasto restaurado',x.desc);save();render()})},
  saveclose:()=>{const day=ui.cDay,cv=$('#ccash').value,dv=$('#cdig').value;
    if(cv===''&&dv==='')return toast('Escribe lo que contaron');
    const c=calc(day),was=!!(S.days[day]&&S.days[day].closed);
    logA(was?'Cierre modificado':'Cierre guardado',`efectivo ${cv===''?'—':fmt(digits(cv))}, Nequi ${dv===''?'—':fmt(digits(dv))}`);S.days[day]=Object.assign(S.days[day]||{},{closed:{cash:cv===''?null:digits(cv),dig:dv===''?null:digits(dv),ts:Date.now(),by:S.seller,expCash:c.expCash,expDig:c.dig}});
    save();render();toast('Cierre guardado')},
  copyclose:()=>copy(closeText(ui.cDay),'Resumen copiado'),
  pickday:id=>{ui.rDay=id;render()},
  saveprod:id=>{const p=S.products.find(x=>x.id===id);const n=$('#pn-'+id).value.trim(),pr=digits($('#pp-'+id).value);if(!n||!pr)return toast('El producto necesita nombre y precio');if(pr!==p.price||n!==p.name)logA(pr!==p.price?'Precio cambiado':'Producto renombrado',pr!==p.price?`${p.name}: ${fmt(p.price)} → ${fmt(pr)}`:`${p.name} → ${n}`);p.name=n;p.price=pr;save();render();toast('Producto guardado')},
  delprod:id=>{const i=S.products.findIndex(x=>x.id===id);const [p]=S.products.splice(i,1);delete ui.cart[id];logA('Producto eliminado',`${p.name} ${fmt(p.price)}`);save();render();toast(p.name+' eliminado','Deshacer',()=>{if(!S)return;S.products.splice(i,0,p);logA('Producto restaurado',p.name);save();render()})},
  addprod:()=>{const k=(document.querySelector('input[name=npKind]:checked')||{}).value||'producto';
    if(!addProduct($('#npName').value,$('#npPrice').value,k))return;render();
    const kr=document.querySelector('input[name=npKind][value="'+k+'"]');if(kr)kr.checked=true;const f=$('#npName');if(f)f.focus()},
  newprod:id=>{ui.newKind=id||'producto';openSheet('newprod');setTimeout(()=>{const f=$('#spName');if(f)f.focus()},60)},
  addprodsheet:()=>{const k=(document.querySelector('input[name=spKind]:checked')||{}).value||'producto';
    if(!addProduct($('#spName').value,$('#spPrice').value,k))return;closeSheet();render()},
  finishsetup:()=>{if(!S.products.length)return;S.setupDone=true;if(!S.seller&&S.sellers.length)S.seller=S.sellers[0];save();ui.view='caja';ui.cDay=td();render();toast('Listo. Abre la caja con la base de efectivo')},
  doreset:()=>{if(S.demo)return A.wipeall();
    const pf=S.profile,sl=S.sellers,me=S.seller,lg=S.log||[];S=blank();S.profile=pf;S.sellers=sl;S.seller=me;S.log=lg;logA('Datos borrados','productos, ventas y caja');phClear();ui.cart={};closeSheet();save();ui.view='vender';render();setTimeout(()=>{const f=$('#npName');if(f)f.focus()},60)},
  addseller:async()=>{const n=$('#nsName').value.trim(),pin=$('#nsPin').value;if(n.length<2)return toast('Escribe el nombre');
    if(O.pins.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast('Ya hay alguien con ese nombre');
    if(!/^\d{4,6}$/.test(pin))return toast('El PIN debe tener de 4 a 6 números');if(pinWeak(pin))return toast('Ese PIN es muy fácil de adivinar');
    O.pins.push({name:n,wrap:await wrapWith(pin,DEKraw)});S.sellers.push(n);logA('Persona agregada',n);save();render();toast(n+' ya puede entrar con su PIN')},
  delseller:n=>{if(n===O.meta.owner)return;O.pins=O.pins.filter(p=>p.name!==n);S.sellers=S.sellers.filter(x=>x!==n);logA('Persona quitada',n);save();render();toast(n+' ya no puede entrar')},
  backup:()=>{logA('Respaldo copiado','cifrado');save();copy(JSON.stringify(O),'Respaldo cifrado copiado: pégalo en un chat o nota')},
  csv:()=>{const L=['fecha,hora,productos,total,forma_pago,estado,confirmacion,vendedora,motivo_anulacion,debe'];
    S.sales.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>L.push([s.day,tm(s.ts),'"'+itemsText(s).replace(/"/g,"'")+'"',s.total,s.method||'',s.status,s.transfer||'','"'+(s.seller||'')+'"','"'+(s.voidReason||'')+'"','"'+(s.debtor||'')+'"'].join(',')));
    logA('Ventas exportadas','CSV sin cifrar');save();copy(L.join('\n'),'Ventas copiadas en formato CSV')},
  restore:()=>restoreFrom($('#bkIn').value),
  askclean:()=>openSheet('clean'),
  doclean:()=>{logA('Ventas y caja borradas',`${S.sales.length} ventas`);S.sales=[];S.expenses=[];S.days={};S.demo=false;ui.cart={};closeSheet();phClear();save();ui.view='caja';ui.cDay=td();render();toast('Listo. Empieza abriendo la caja de hoy')}
};
function addProduct(name,price,kind){
  const n=String(name||'').trim(),pr=digits(price);
  if(!n||!pr){toast('Escribe el nombre y el precio');return false}
  if(S.products.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast('Ya existe un producto con ese nombre');return false}
  S.products.push({id:uid(),name:n,price:pr,kind:kind==='adicional'?'adicional':'producto'});if(S.setupDone)logA('Producto agregado',`${n} ${fmt(pr)}`);save();toast(n+' agregado · '+fmt(pr));return true;
}
async function restoreFrom(text){
  let d;try{d=JSON.parse(text)}catch(e){return toast('Ese texto no es un respaldo válido')}
  if(!d||d.v!==3||!d.pw||!d.data)return toast('Ese texto no es un respaldo de Ventico App');
  const pw=($('#bkPw')||{}).value||'';if(!pw)return toast('Escribe la contraseña del dueño de ese respaldo');
  let raw;try{raw=await unwrapWith(pw,d.pw)}catch(e){return toast('La contraseña no corresponde a ese respaldo')}
  O=d;O.lock={fails:0,until:0,total:0};await openWith(raw,O.meta.owner,'owner','al restaurar un respaldo');logA('Respaldo restaurado',`${S.sales.length} ventas`);save();ui.view='vender';render();
  toast(`Respaldo restaurado: ${S.sales.length} ventas`);
}

const OWN=new Set(['voidmode','chmethod','delexp','editbase','askclean','doclean','doreset','saveprod','delprod','addseller','delseller','pinchange','savepin','backup','csv','restore','saveprofile','changepw']);
function needsOwner(a,id){if(!authed||!S||!S.setupDone&&a!=='tab')return false;if(a==='tab')return id==='ajustes';if(a==='saveclose')return !!calc(ui.cDay).closed;return OWN.has(a)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,f=A[a];if(!f)return;e.preventDefault();
  if(needsOwner(a,t.dataset.id)&&!isOwner()){ui.pending={a,id:t.dataset.id};openSheet('owner');setTimeout(()=>{const x=$('#owPw');if(x)x.focus()},60);return}
  if(isOwner()&&role!=='owner'&&needsOwner(a,t.dataset.id))ui.elevUntil=Date.now()+5*60000;
  f(t.dataset.id,t)});
['pointerdown','keydown','input','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{capture:true,passive:true}));
const idleCheck=()=>{if(authed&&Date.now()-lastAct>LOCK_MS){lock();toast('Se bloqueó por 10 minutos sin uso')}};
setInterval(idleCheck,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')idleCheck();else save()});
window.addEventListener('pagehide',()=>save());
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('pin'))t.value=t.value.replace(/\D/g,'').slice(0,6);
  if(t.classList.contains('phonein')){const v=t.value.replace(/\D/g,'').replace(/^57(?=3\d{9}$)/,'').slice(0,10);t.value=v.length>6?v.slice(0,3)+' '+v.slice(3,6)+' '+v.slice(6):v.length>3?v.slice(0,3)+' '+v.slice(3):v}
  if(t.classList.contains('moneyin')){const v=digits(t.value);t.value=v?thou(v):(t.value.replace(/\D/g,'')===''?'':'0')}
  if(t.id==='recv'){ui.co.received=digits(t.value);$('#chg').innerHTML=changeHTML()}
  if(t.id==='debtor')ui.co.debtor=t.value;
  if(t.id==='ccash'||t.id==='cdig'){const c=calc(ui.cDay);const cv=$('#ccash').value,dv=$('#cdig').value;
    $('#dcash').innerHTML=cv===''?'':diffHTML(c.expCash,digits(cv));$('#ddig').innerHTML=dv===''?'':diffHTML(c.dig,digits(dv))}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='vDay'&&t.value){ui.vDay=t.value;render()}
  if(t.id==='cDay'&&t.value){ui.cDay=t.value;ui.editBase=false;render()}
  if(t.id==='rDay'&&t.value){ui.rDay=t.value;render()}
  if(t.id==='arrived')ui.co.arrived=t.checked;
  if(t.id==='qv1'||t.id==='qv2'){ui.co[t.id]=t.checked;const b=$('#qrOk');if(b)b.disabled=!(ui.co.qv1&&ui.co.qv2&&ui.co.photo)}
  if(t.id==='qrPhoto'&&t.files&&t.files[0]){compress(t.files[0]).then(d=>{ui.co.photo=d;renderSheet()},()=>toast('No se pudo leer la foto. Intenta de nuevo'))}
  if(t.id==='evPhoto'&&t.files&&t.files[0]){const s=sale();compress(t.files[0]).then(d=>{phPut(s.id,d);logA(s.photo?'Foto de pago cambiada':'Foto de pago agregada',`${fmt(s.total)} de las ${tm(s.ts)}`);s.photo=true;commit();toast('Foto guardada')},()=>toast('No se pudo leer la foto'))}
  if(t.id==='bkFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const id=e.target.id;
    if(id==='npName'||id==='npPrice'){e.preventDefault();if(id==='npName'){$('#npPrice').focus()}else A.addprod()}
    if(id==='spName'||id==='spPrice'){e.preventDefault();if(id==='spName'){$('#spPrice').focus()}else A.addprodsheet()}
    if(id==='nsName'){e.preventDefault();$('#nsPin').focus()}
    if(id==='nsPin'){e.preventDefault();document.querySelector('[data-a=addseller]').click()}
    if(id==='lgPw'){e.preventDefault();A.dologin()}
    if(id==='lgPin'){e.preventDefault();A.dopin()}
    if(id==='owPw'){e.preventDefault();A.ownerok()}
    if(id==='cuName'||id==='cuPrice'){e.preventDefault();A.addcustom()}}
if(e.key==='Escape'&&!$('#sheet').hidden&&!ui.policyMust)closeSheet()});
/* Botón atrás de Android (lo usa la versión APK): cierra ventanas o vuelve a Vender antes de salir. */
window.venticoBack=()=>{
  if(!$('#sheet').hidden){if(!ui.policyMust)closeSheet();return true}
  if(authed&&ui.view!=='vender'){A.tab('vender');return true}
  if(!authed&&ui.lockSel){ui.lockSel=null;render();return true}
  return false};
render();
})();
</script>
